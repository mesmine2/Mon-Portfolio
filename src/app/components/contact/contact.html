<section id="contact" class="contact">
  <div class="container">
    <div class="contact-card">
      <div class="contact-left">
        <h2>Contact</h2>
        <div class="social-links">
          @for (s of socials; track s.label) {
            <a [href]="s.url" target="_blank" class="icon-btn social-icon" [attr.aria-label]="s.label">
              <span [innerHTML]="s.icon"></span>
            </a>
          }
        </div>
      </div>

      <form class="contact-form" (ngSubmit)="onSubmit()">
        <input type="text" name="name" placeholder="Name" [(ngModel)]="form.name" required />
        <input type="email" name="email" placeholder="Email" [(ngModel)]="form.email" required />
        <textarea name="message" placeholder="Message" rows="4" [(ngModel)]="form.message" required></textarea>
        <button type="submit" class="btn btn-send">
          <span class="btn-icon" [innerHTML]="icons.send"></span>
          Send Message
        </button>
      </form>
    </div>
  </div>
</section>
