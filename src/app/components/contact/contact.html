<section id="contact" class="contact">
  <div class="container">
    <div class="contact-card">
      <div class="contact-left">
        <h2>Contact</h2>
        <p class="contact-text">
          Une opportunité, une question ou juste envie d'échanger ?
          N'hésite pas à me contacter.
        </p>

        <div class="social-links">
          @for (s of socials; track s.label) {
            
            <a  [href]="s.url"
              target="_blank"
              rel="noopener noreferrer"
              class="social-btn"
              [attr.aria-label]="s.label"
            >
              <span class="social-icon" [innerHTML]="s.icon | safeHtml"></span>
              <span class="social-label">{{ s.label }}</span>
            </a>
          }
        </div>
      </div>

      <form class="contact-form" (ngSubmit)="onSubmit()">
        <input type="text" name="name" placeholder="Nom" [(ngModel)]="form.name" required />
        <input type="email" name="email" placeholder="Email" [(ngModel)]="form.email" required />
        <textarea name="message" placeholder="Message" rows="4" [(ngModel)]="form.message" required></textarea>
        <button type="submit" class="btn-send">
          <span class="btn-icon" [innerHTML]="icons.send | safeHtml"></span>
          Envoyer le message
        </button>
      </form>
    </div>
  </div>
</section>
