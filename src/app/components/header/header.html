<header class="header">
  <div class="container header-inner">
    <a href="#" class="logo">
      <span class="logo-dot"></span>
      Pankui Kamtcha Mesmine
    </a>

    <nav class="nav-desktop">
      <a href="#about" class="nav-link" [class.active]="activeSection() === 'about'">A propos</a>
      <a href="#skills" class="nav-link" [class.active]="activeSection() === 'skills'">Compétences</a>
      <a href="#projects" class="nav-link" [class.active]="activeSection() === 'projects'">Projets</a>
    </nav>

    <div class="header-actions">
      <button class="icon-btn" (click)="themeService.toggle()" aria-label="Changer de thème">
        <span [innerHTML]="(themeService.theme() === 'dark' ? icons.sun : icons.moon) | safeHtml"></span>
      </button>

      <a href="/cv.pdf" download class="cv-btn">
        <span class="cv-icon" [innerHTML]="icons.download | safeHtml"></span>
        <span class="cv-label">CV</span>
      </a>

      <a href="#contact" class="btn btn-primary contact-btn">Me Contacter</a>

      <button class="icon-btn menu-toggle" (click)="toggleMenu()" aria-label="Menu">
        <span [innerHTML]="(menuOpen() ? icons.close : icons.menu) | safeHtml"></span>
      </button>
    </div>
  </div>
</header>

@if (menuOpen()) {
  <div class="mobile-backdrop" (click)="closeMenu()"></div>
  <nav class="nav-mobile">
    <a href="#about" class="mobile-link" (click)="closeMenu()">À propos</a>
    <a href="#skills" class="mobile-link" (click)="closeMenu()">Compétences</a>
    <a href="#projects" class="mobile-link" (click)="closeMenu()">Projets</a>
  </nav>
}
